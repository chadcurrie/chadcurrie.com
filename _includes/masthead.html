<header class="masthead">
  <div class="masthead__identity">
    <p class="masthead__name"><a href="{{ '/' | relative_url }}">Chad Currie</a></p>
  </div>
  <nav class="masthead__nav" aria-label="Primary">
    {% for item in site.nav %}
      {% assign is_current = false %}
      {% if item.url == "/" and page.url == "/" %}{% assign is_current = true %}{% endif %}
      {% if item.url != "/" and page.url == item.url %}{% assign is_current = true %}{% endif %}
      <a href="{{ item.url | relative_url }}"{% if is_current %} aria-current="page"{% endif %}>{{ item.title }}</a>
    {% endfor %}
  </nav>
</header>
